[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc = "0.8.37"
auto_detect_solc = false
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
cbor_metadata = false
fs_permissions = [
    { access = "read", path = "../config" },
    # The pinned-fork lifecycle writes its measured amounts here for the manifest recorder.
    { access = "read-write", path = "../.tmp" },
]

[fuzz]
runs = 256

[invariant]
runs = 256
depth = 64
fail_on_revert = true
